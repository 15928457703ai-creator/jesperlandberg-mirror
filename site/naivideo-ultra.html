<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naivideo — 11-Card 3D Collage | Fengmei</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/naivideo-ultra/style.css">
</head>
<body>
<div id="app">

  <div id="shaker">
    <div id="stageWrap">
      <div id="stage">
        <div id="wall">
          <div id="wallInner"><!-- 11 cards built by app.js from layout.json --></div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="dust"></canvas>
  <div id="shock"></div>
  <div id="flash"></div>

  <div id="focus"></div>
  <div id="focusCard"></div>
  <div id="focusMeta">
    <div class="idx"></div><div class="ttl"></div>
    <div class="hint">← / → 切换 &nbsp;·&nbsp; ESC 关闭</div>
  </div>
  <div id="navPrev">‹</div><div id="navNext">›</div>

  <div id="hud">
    <div><span class="k">MODE</span> &nbsp;<b id="hMode">IDLE</b></div>
    <div><span class="k">X / Y</span> &nbsp;<b id="hXY">960 / 540</b></div>
    <div><span class="k">FPS</span> &nbsp;<b id="hFps">60</b></div>
    <div><span class="k">CARDS</span> &nbsp;<b id="hCards">11</b></div>
  </div>

  <div id="hint">
    <kbd>D</kbd> 引爆 &nbsp; <kbd>R</kbd> 重置 &nbsp; <kbd>SPACE</kbd> 巡航
    &nbsp; <kbd>ESC</kbd> 关闭 &nbsp; <kbd>←</kbd><kbd>→</kbd> 切换聚焦 &nbsp;·&nbsp; 点击卡片看详情
  </div>

  <div id="console">
    <h4>NAIVIDEO / FX CONSOLE</h4>
    <div class="row"><span>强度 <b id="cVal">1.00</b></span><span>INTENSITY</span></div>
    <input id="cRange" type="range" min="0.3" max="2" step="0.05" value="1" aria-label="强度">
    <div class="row"><span>WAVE</span><div class="tog on" id="tWave"></div></div>
    <div class="row"><span>DUST</span><div class="tog on" id="tDust"></div></div>
    <div class="row"><span>CRUISE</span><div class="tog" id="tCruise"></div></div>
    <div class="btns">
      <div class="btn hot" id="bBoom">引爆</div>
      <div class="btn" id="bReset">重置</div>
    </div>
  </div>

</div>
<script src="/naivideo-ultra/assets/gsap.min.js"></script>
<script src="/naivideo-ultra/app.js"></script>
</body>
</html>
