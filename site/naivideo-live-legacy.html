<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Naivideo — Motion Showcase | Fengmei</title>
<style>
/* ------------------------------------------------------------------
   Naivideo bento motion showcase.

   The nine slices supplied by the user are placed in the exact 5x3
   arrangement of the reference collage.  Background is a single flat
   colour: no grid, no gradient, no glow, no extra decoration.

   Animation is driven by ONE GSAP master timeline (12s, repeat:-1, see the
   script at the bottom).  A single timeline means the recorder can seek
   deterministically with master.time(t), and frame 0 === frame 12 so the
   exported mp4 loops seamlessly.  GSAP is served locally from this folder,
   so the offline mirror still makes zero external requests.

   Entrance follow-up (2026-11-09): the old CSS keyframes snapped every card
   in over ~0.5s with 26px of travel, a .93 scale and 9px of blur.  The new
   timeline separates opacity from transform: a power2.out fade brings each
   tile up from a soft, semi-visible state while y / scale / blur settle over
   2.4s with sine.inOut.  A 0.11s stagger turns it into a gentle focus-pull
   wave.  The loop starts AND ends on that same soft state (never on black),
   which keeps the home card readable at every point of the 12s cycle.
   ------------------------------------------------------------------ */
:root{
  --bg:#0a0a0c;
  --ink:#f4f4f6;
  --muted:#77777f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.frame{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:18px;
  padding:24px 3vw;
}
.hud,.hint{
  width:100%;
  max-width:1600px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}
.hud a{color:var(--ink);text-decoration:none;letter-spacing:.02em}
.hud a:hover{opacity:.6}
.hud .brand{font-size:15px;font-weight:600}
.hud .tag{color:var(--muted)}
.hint{border-top:1px solid #1c1c21;padding-top:12px;font-size:10px}

/* ---- stage: flat colour, 16:9, responsive container units ---- */
.stage{
  position:relative;
  width:100%;
  max-width:1600px;
  aspect-ratio:16/9;
  background:var(--bg);
  padding:2.125% 2.75%;
  container-type:inline-size;
  overflow:hidden;
}
.grid{
  position:relative;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:1cqw;
}
.tile{position:relative;min-width:0;min-height:0;transition:opacity .5s ease,filter .5s ease}
.tile:hover{z-index:30}
.t-inner{position:absolute;inset:0}
.t-face{
  position:absolute;inset:0;
  border-radius:1.7cqw;
  filter:brightness(.88) saturate(.94);
  opacity:.9;
  will-change:transform,filter;
  transition:translate .55s cubic-bezier(.22,1,.36,1),scale .55s cubic-bezier(.22,1,.36,1),filter .45s ease;
}
.t-face img{
  display:block;width:100%;height:100%;
  object-fit:fill;
  -webkit-user-drag:none;user-select:none;
  will-change:transform;
}

/* ---- exact 5x3 collage placement ---- */
.t-hero   {grid-area:1/1/3/2}
.t-effects{grid-area:1/2/2/3}
.t-create {grid-area:1/3/2/5}
.t-episode{grid-area:1/5/3/6}
.t-navigate{grid-area:2/2/3/4}
.t-version{grid-area:2/4/4/5}
.t-music  {grid-area:3/1/4/2}
.t-drama  {grid-area:3/2/4/4}
.t-meet   {grid-area:3/5/4/6}

/* ---- hover: lift + enlarge, everything else falls back ----
   Uses the independent translate/scale properties so the GSAP-driven
   `transform` on the same element keeps working underneath. */
body:not(.capture) .grid:hover .tile:not(:hover){opacity:.38;filter:saturate(.55)}
body:not(.capture) .tile:hover .t-face{
  /* GSAP writes its own inline transform state while the spotlight tween is
     running, so the independent transform properties need !important here
     (same as filter/box-shadow) to win over that inline style on hover. */
  translate:0 -14px!important;
  scale:1.06!important;
  filter:brightness(1.14) saturate(1.05)!important;
  box-shadow:0 30px 70px rgba(0,0,0,.78),0 0 0 1px rgba(255,255,255,.2)!important;
}

/* ---- wordmark, matching the reference collage ---- */
.wordmark{
  position:absolute;
  left:3.3%;bottom:3.1%;
  font-size:2.45cqw;
  font-weight:600;
  letter-spacing:-.035em;
  color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.55);
  pointer-events:none;
}

/* ---- still mode: clean, animation-free collage for the poster/og:image ----
   No timeline is built in this mode, so there are no inline styles to undo. */
body.still .t-inner{opacity:1;transform:none;filter:none;visibility:inherit}
body.still .t-face{opacity:1;filter:none;transform:none;box-shadow:none}
body.still .t-face img{transform:none}
body.still .wordmark{opacity:1;letter-spacing:-.035em;visibility:inherit}

/* ---- capture mode: pixel-exact 1600x900 frames for the mp4 ---- */
body.capture{cursor:none}
body.capture .frame{padding:0;gap:0}
body.capture .hud,body.capture .hint,body.capture .back{display:none}
body.capture .stage{width:1600px;height:900px;max-width:none;aspect-ratio:auto}
</style>
</head>
<body>
<div class="frame">
  <header class="hud">
    <a class="brand" href="/">Fengmei</a>
    <span class="tag">Naivideo / Motion Showcase</span>
    <a class="back" href="/projects/naivideo">View project &#8599;</a>
  </header>

  <div class="stage" id="stage">
    <div class="grid">
      <div class="tile t-hero"     style="--k:0"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/hero.png"     alt="Naivideo create feed"></div></div></div>
      <div class="tile t-effects"  style="--k:1"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/effects.png"  alt="AI Effects"></div></div></div>
      <div class="tile t-create"   style="--k:2"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/create.png"   alt="Create your vision with AI"></div></div></div>
      <div class="tile t-episode"  style="--k:3"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/episode.png"  alt="Episode 1"></div></div></div>
      <div class="tile t-navigate" style="--k:4"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/navigate.png" alt="Navigate AI Video"></div></div></div>
      <div class="tile t-version"  style="--k:5"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/version.png"  alt="New Version Available"></div></div></div>
      <div class="tile t-music"    style="--k:6"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/music.png"    alt="AI Music"></div></div></div>
      <div class="tile t-drama"    style="--k:7"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/drama.png"    alt="Naivideo drama feed"></div></div></div>
      <div class="tile t-meet"     style="--k:8"><div class="t-inner"><div class="t-face"><img src="/naivideo-live/meet.png"     alt="Meet Naivideo"></div></div></div>
    </div>
    <div class="wordmark">Naivideo</div>
  </div>

  <footer class="hint"><span>Auto playing &#183; Loop 12s</span><span>Hover a tile to focus</span></footer>
</div>

<script src="/naivideo-live/gsap.min.js"></script>
<script>
/* ---------------------------------------------------------------------
   One GSAP timeline = one 12s loop.  Everything is placed with the
   position parameter (never chained `delay`s), and the state at t=0 is
   byte-for-byte the state at t=12, so the exported mp4 has no seam.
   --------------------------------------------------------------------- */
(function () {
  var qp = new URLSearchParams(location.search);
  var capture = qp.has('capture');
  var still = qp.has('still');
  if (capture) document.body.classList.add('capture');
  if (still) document.body.classList.add('still');

  var T = 12;
  var tiles = gsap.utils.toArray('.tile');
  var inners = tiles.map(function (t) { return t.querySelector('.t-inner'); });
  var faces = tiles.map(function (t) { return t.querySelector('.t-face'); });
  var imgs = tiles.map(function (t) { return t.querySelector('.t-face img'); });
  var word = document.querySelector('.wordmark');

  // The loop begins AND ends on SOFT: a dim, slightly out-of-focus collage
  // rather than a black frame.  The home-card texture therefore always shows
  // the composition, and "entrance" reads as a slow focus pull instead of a
  // black-to-bright flash.  Identical start/end state keeps the seam exact.
  var SOFT = { autoAlpha: .34, y: 8, scale: .993, filter: 'blur(3px)' };
  var SHOWN = { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)' };
  var FACE_REST = {
    scale: 1, y: 0, opacity: .9,
    filter: 'brightness(.88) saturate(.94)',
    boxShadow: '0 0 0 0 rgba(0,0,0,0)'
  };
  var FACE_HI = {
    scale: 1.045, y: -5, opacity: 1,
    filter: 'brightness(1.14) saturate(1.05)',
    boxShadow: '0 22px 55px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.14)'
  };

  // Reduced motion: show the finished collage, no looping animation.
  // matchMedia() reverts (and kills) everything it created automatically.
  function staticState() {
    gsap.set(inners, SHOWN);
    gsap.set(faces, FACE_REST);
    gsap.set(imgs, { scale: 1 });
    gsap.set(word, { autoAlpha: 1, letterSpacing: '-.035em' });
  }

  function buildTimeline() {
    var tl = gsap.timeline({ paused: true, repeat: -1,
                             defaults: { ease: 'power2.out' } });

    // A dummy tween pins the cycle to exactly 12s even if a child is trimmed.
    tl.to({}, { duration: T }, 0);

    /* ---- SOFT ENTRANCE ------------------------------------------------
       Two parallel layers per tile:
         opacity  : 1.50s power2.out  -> rises from the dim SOFT state
         transform: 2.40s sine.inOut -> travel / scale / blur melt away slowly
       0.11s stagger spreads the nine tiles into a gentle focus-pull wave. */
    tl.fromTo(inners,
      { autoAlpha: SOFT.autoAlpha },
      { autoAlpha: 1, duration: 1.5, ease: 'power2.out', stagger: .11 }, 0);
    tl.fromTo(inners,
      { y: SOFT.y, scale: SOFT.scale, filter: SOFT.filter },
      { y: 0, scale: 1, filter: 'blur(0px)',
        duration: 2.4, ease: 'sine.inOut', stagger: .11 }, 0);

    /* ---- soft exit, symmetric with the entrance ----------------------
       Ends on the exact SOFT state so t=12 matches t=0. */
    tl.to(inners,
      { autoAlpha: SOFT.autoAlpha, duration: 1.6, ease: 'sine.inOut', stagger: .09 }, 9.35);
    tl.to(inners,
      { y: SOFT.y, scale: SOFT.scale, filter: SOFT.filter,
        duration: 1.9, ease: 'sine.inOut', stagger: .09 }, 9.30);

    /* ---- one tile at a time takes the spotlight ---------------------- */
    faces.forEach(function (f, i) {
      var at = 3.15 + i * .6;
      tl.to(f, Object.assign({}, FACE_HI,
        { duration: .6, ease: 'sine.inOut' }), at);
      tl.to(f, Object.assign({}, FACE_REST,
        { duration: .85, ease: 'sine.inOut' }), at + .6);
    });

    /* ---- slow idle drift + image push-in (full 12s round trip) -------
       Different amplitudes per tile create an out-of-phase feel without
       any child tween running past the 12s mark. */
    tl.to(tiles, {
      y: function (i) { return [-4, -6, -5, -7, -4, -6, -5, -7, -4][i]; },
      duration: 6, ease: 'sine.inOut'
    }, 0);
    tl.to(tiles, { y: 0, duration: 6, ease: 'sine.inOut' }, 6);
    tl.to(imgs, { scale: 1.025, duration: 6, ease: 'sine.inOut' }, 0);
    tl.to(imgs, { scale: 1, duration: 6, ease: 'sine.inOut' }, 6);

    /* ---- wordmark: eases in with the tiles, leaves with them --------- */
    tl.fromTo(word,
      { autoAlpha: 0, letterSpacing: '.06em' },
      { autoAlpha: 1, letterSpacing: '-.035em',
        duration: 1.8, ease: 'power2.out' }, 1.45);
    tl.to(word,
      { autoAlpha: 0, letterSpacing: '.06em',
        duration: 1.8, ease: 'sine.inOut' }, 9.30);

    if (Math.abs(tl.duration() - T) > .001) {
      console.error('master timeline duration is ' + tl.duration() + ', expected ' + T);
    }
    return tl;
  }

  if (still) {
    // Poster mode: build NO timeline at all, so there are no inline styles
    // and the CSS .still rules produce a perfectly clean, unfiltered collage.
    return;
  }

  if (capture) {
    // Deterministic playback for the frame recorder. No rAF, no wall clock.
    window.__nvTimeline = buildTimeline();
    window.__nvTimeline.pause(0);
    window.__nvSeek = function (t) {
      window.__nvTimeline.time(((t % T) + T) % T, false);
    };
    window.__nvDuration = window.__nvTimeline.duration();
    return;
  }

  var mm = gsap.matchMedia();
  mm.add({
    reduce: '(prefers-reduced-motion: reduce)',
    full: '(prefers-reduced-motion: no-preference)'
  }, function (ctx) {
    if (ctx.conditions.reduce) {
      staticState();
      return;
    }
    var master = buildTimeline();
    window.__nvTimeline = master;   // read-only inspection for verification
    master.play(0);
    // cleanup when the media query stops matching / the page goes away
    return function () { master.kill(); delete window.__nvTimeline; };
  });
})();
</script>
</body>
</html>
