<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>OPPO自助服务 — Cover Motion | Fengmei</title>
<style>
/* ------------------------------------------------------------------
   OPPO 自助服务 home-cover motion showcase.

   The four supplied slices are placed at the exact positions recovered by
   tools/locate_oppo_self_slices.py against the current static cover
   (site/oppo-self/1.jpg, 1600x900).  No extra element is introduced: only
   those three slices, the bubble background and the two lines of copy that
   already exist in the artwork.

   ONE paused GSAP master timeline (12s, repeat:-1) drives everything, so the
   recorder can seek deterministically with master.time(t) and frame 0 ===
   frame 12.  Three nested layers keep the animated properties independent:
     .cut      -> slow idle parallax (x / y)
     .cut-in   -> soft entrance / exit (autoAlpha, y, scale, blur)
     .face     -> rotating spotlight (scale, y, brightness)
   Transform aliases and autoAlpha are used throughout; reduced motion is
   handled with gsap.matchMedia(), which also supplies the cleanup.
   ------------------------------------------------------------------ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#fff;
  font-family:"PingFang SC","Helvetica Neue",Helvetica,"Microsoft YaHei",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.stage{
  position:relative;
  width:100%;max-width:1600px;
  aspect-ratio:16/9;
  background:#fff;
  overflow:hidden;
  container-type:inline-size;
}
body.capture,body.still{display:block}
body.capture .stage,body.still .stage{width:1600px;height:900px;max-width:none;aspect-ratio:auto}

.bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;will-change:transform,opacity;
  -webkit-user-drag:none;user-select:none;
}

/* positions recovered by masked NCC (1600x900 space), expressed in % so the
   composition scales with the stage */
.cut{position:absolute;will-change:transform}
.cut.intl{left:4%;      top:51.5556%; width:31.5%;   height:48.4444%; z-index:1}
.cut.cn  {left:26%;     top:36.8889%; width:45.25%;  height:62.4444%; z-index:2}
.cut.web {left:61.875%; top:28.2222%; width:37.875%; height:71.3333%; z-index:3}
.cut-in,.face{position:absolute;inset:0;will-change:transform,opacity,filter}
/* An explicit filter value gives GSAP a defined start for the spotlight
   tween; interpolating from `none` would snap a whole slice on frame 1. */
.face{filter:brightness(1) saturate(1)}
.face img{
  display:block;width:100%;height:100%;object-fit:fill;
  -webkit-user-drag:none;user-select:none;
}

.titles{
  position:absolute;left:0;right:0;top:11.5%;
  text-align:center;z-index:4;
  color:#111;will-change:transform,opacity;
}
.headline{
  margin:0;font-size:3.05cqw;line-height:1.2;font-weight:700;
  letter-spacing:-.02em;
}
.subline{
  margin:1.1cqw 0 0;font-size:1.7cqw;line-height:1.35;font-weight:500;
  letter-spacing:.01em;color:#3a3a3a;
}
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="/oppo-self-live/bg.jpg" alt="">
  <div class="cut intl"><div class="cut-in"><div class="face">
    <img src="/oppo-self-live/intl.png" alt=""></div></div></div>
  <div class="cut cn"><div class="cut-in"><div class="face">
    <img src="/oppo-self-live/cn.png" alt=""></div></div></div>
  <div class="cut web"><div class="cut-in"><div class="face">
    <img src="/oppo-self-live/web.png" alt=""></div></div></div>
  <div class="titles">
    <h1 class="headline">大型项目落地多平台</h1>
    <p class="subline">OPPO服务 国内外APP+PC</p>
  </div>
</div>

<script src="/oppo-self-live/gsap.min.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var capture = params.has('capture');
  var still = params.has('still');
  if (capture) document.body.classList.add('capture');
  if (still) document.body.classList.add('still');

  var T = 12;
  var cuts = gsap.utils.toArray('.cut');
  var inners = cuts.map(function (c) { return c.querySelector('.cut-in'); });
  var faces = cuts.map(function (c) { return c.querySelector('.face'); });
  var bg = document.querySelector('.bg');
  var headline = document.querySelector('.headline');
  var subline = document.querySelector('.subline');

  // The loop starts AND ends on a fully readable, barely softened state.
  // This artwork is white-on-white, so a dim/blurred loop start would read as
  // a blank card for ~3s every cycle.  The entrance is therefore a gentle
  // focus pull rather than a fade-in, and frame 0 === frame 12 exactly.
  var SOFT = { autoAlpha: .96, y: 5, scale: .996, filter: 'blur(1.1px)' };
  var SHOWN = { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)' };
  var TYPE_SOFT = { autoAlpha: .92, y: 5, letterSpacing: '.005em' };
  var FACE_REST = { scale: 1, y: 0, filter: 'brightness(1) saturate(1)' };
  var FACE_HI = { scale: 1.035, y: -12, filter: 'brightness(1.09) saturate(1.05)' };

  function staticState() {
    gsap.set(cuts, { x: 0, y: 0 });
    gsap.set(inners, SHOWN);
    gsap.set(faces, FACE_REST);
    gsap.set(bg, { scale: 1, autoAlpha: 1 });
    gsap.set(headline, { autoAlpha: 1, y: 0, letterSpacing: '-.02em' });
    gsap.set(subline, { autoAlpha: 1, y: 0, letterSpacing: '.01em' });
  }

  function buildTimeline() {
    // Define the spotlight's resting filter up front on every layer so the
    // first `to()` of each slice interpolates instead of snapping from none.
    gsap.set(faces, FACE_REST);
    var tl = gsap.timeline({ paused: true, repeat: -1,
                             defaults: { ease: 'power2.out' } });
    // pin the cycle to exactly 12s even if a child is trimmed
    tl.to({}, { duration: T }, 0);

    /* ---- soft entrance: opacity and transform settle on separate clocks -- */
    tl.fromTo(bg, { scale: 1.03, autoAlpha: .86 },
      { scale: 1, autoAlpha: 1, duration: 2.4, ease: 'sine.inOut' }, 0);
    tl.fromTo(inners, { autoAlpha: SOFT.autoAlpha },
      { autoAlpha: 1, duration: 1.5, ease: 'power2.out', stagger: .16 }, 0);
    tl.fromTo(inners,
      { y: SOFT.y, scale: SOFT.scale, filter: SOFT.filter },
      { y: 0, scale: 1, filter: 'blur(0px)',
        duration: 2.4, ease: 'sine.inOut', stagger: .16 }, 0);
    tl.fromTo(headline, TYPE_SOFT,
      { autoAlpha: 1, y: 0, letterSpacing: '-.02em',
        duration: 1.6, ease: 'power2.out' }, .35);
    tl.fromTo(subline, TYPE_SOFT,
      { autoAlpha: 1, y: 0, letterSpacing: '.01em',
        duration: 1.6, ease: 'power2.out' }, .55);

    /* ---- one platform at a time takes the spotlight --------------------- */
    faces.forEach(function (f, i) {
      var at = 3.3 + i * 1.75;
      tl.to(f, Object.assign({}, FACE_HI,
        { duration: .85, ease: 'sine.inOut' }), at);
      tl.to(f, Object.assign({}, FACE_REST,
        { duration: 1.0, ease: 'sine.inOut' }), at + .9);
    });

    /* ---- slow idle parallax, full 12s round trip (seam stays exact) ----- */
    tl.to(cuts, {
      x: function (i) { return [3, -3, 4][i]; },
      y: function (i) { return [-5, -8, -6][i]; },
      duration: 6, ease: 'sine.inOut'
    }, 0);
    tl.to(cuts, { x: 0, y: 0, duration: 6, ease: 'sine.inOut' }, 6);
    tl.to(bg, { scale: 1.018, duration: 6, ease: 'sine.inOut' }, 0);
    tl.to(bg, { scale: 1, duration: 6, ease: 'sine.inOut' }, 6);

    /* ---- soft exit, symmetric with the entrance ------------------------ */
    tl.to(headline, Object.assign({}, TYPE_SOFT,
      { duration: 1.5, ease: 'sine.inOut' }), 9.3);
    tl.to(subline, Object.assign({}, TYPE_SOFT,
      { duration: 1.5, ease: 'sine.inOut' }), 9.3);
    tl.to(inners,
      { autoAlpha: SOFT.autoAlpha, duration: 1.6,
        ease: 'sine.inOut', stagger: .12 }, 9.3);
    tl.to(inners,
      { y: SOFT.y, scale: SOFT.scale, filter: SOFT.filter,
        duration: 1.9, ease: 'sine.inOut', stagger: .12 }, 9.3);

    if (Math.abs(tl.duration() - T) > .001) {
      console.error('master timeline duration is ' + tl.duration() + ', expected ' + T);
    }
    return tl;
  }

  if (still) return;   // clean CSS composition, no inline styles at all

  if (capture) {
    // Deterministic playback for the frame recorder: no rAF, no wall clock.
    var master = buildTimeline();
    master.pause(0);
    window.__osTimeline = master;
    window.__osSeek = function (t) {
      master.time(((t % T) + T) % T, false);
    };
    window.__osDuration = master.duration();
    return;
  }

  var mm = gsap.matchMedia();
  mm.add({
    reduce: '(prefers-reduced-motion: reduce)',
    full: '(prefers-reduced-motion: no-preference)'
  }, function (ctx) {
    if (ctx.conditions.reduce) {
      staticState();
      return;
    }
    var live = buildTimeline();
    window.__osTimeline = live;   // read-only inspection for verification
    live.play(0);
    return function () { live.kill(); delete window.__osTimeline; };
  });
})();
</script>
</body>
</html>
